        id="book-dialog-cover"
        class="book-dialog-cover"
        alt=""
        hidden
    >

    <h2 id="book-dialog-title"></h2>
    <p id="book-dialog-author"></p>


    <aside class="vintage-library-card" aria-label="Library card">
      <img src="images/sig.png" class="library-stamp-logo" alt="From the library of Ethan Wilson">

    <div class="library-card-details">
        <span>AUTHOR</span>
        <p id="library-card-author"></p>

        <span>TITLE</span>
        <p id="library-card-title"></p>
    </div>

<section class="library-card-thoughts">
    <h3>MY THOUGHTS</h3>
    <p id="library-card-notes"></p>
</section>

    <p class="library-card-footer">FROM THE COLLECTION OF E. WILSON</p>
</aside>

</dialog>

<script>
document.querySelectorAll(".rr-shelf-scroll").forEach((shelf) => {
    const panel = document.createElement("label");
    panel.className = "rr-shelf-navigation";
    panel.hidden = true;
    panel.textContent = "Browse the shelf  ←  →";

    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = "0";
    slider.max = "100";
    slider.value = "0";
    panel.append(slider);
let ledge = shelf.nextElementSibling;

if (!ledge?.matches(".rr-walnut-ledge")) {
    ledge = document.createElement("div");
    ledge.className = "rr-walnut-ledge";
    ledge.setAttribute("aria-hidden", "true");
    shelf.after(ledge);
}

ledge.after(panel);

    const scrollDistance = () => shelf.scrollWidth - shelf.clientWidth;

    function syncSlider() {
        const distance = scrollDistance();
        panel.hidden = distance <= 1;

        if (!panel.hidden) {
            slider.value = Math.round(100 * shelf.scrollLeft / distance);
        }
    }

    slider.addEventListener("input", () => {
        shelf.scrollLeft = scrollDistance() * Number(slider.value) / 100;
    });

    shelf.addEventListener("scroll", syncSlider, { passive: true });

    const observer = new ResizeObserver(syncSlider);
    observer.observe(shelf);

    const row = shelf.querySelector(".bookshelf");
    if (row) observer.observe(row);

    syncSlider();
});
</script>

<script>
(() => {
    const desktop = matchMedia("(min-width: 701px)");

    document.querySelectorAll(".reading-room-page .bookshelf").forEach((shelf) => {
        const books = [...shelf.querySelectorAll(":scope > .shelf-book")];
        let frame = 0;

        function drawLedges() {
            shelf.querySelectorAll(":scope > .rr-desktop-ledge")
                .forEach((ledge) => ledge.remove());

            if (!desktop.matches) return;

            const shelfTop = shelf.getBoundingClientRect().top + shelf.clientTop;
            const rowBottoms = new Set();

            for (const book of books) {
                if (!book.getClientRects().length) continue;
                rowBottoms.add(Math.round(
                    book.getBoundingClientRect().bottom - shelfTop
                ));
            }

            for (const bottom of rowBottoms) {
                const ledge = document.createElement("div");
                ledge.className = "rr-desktop-ledge";
                ledge.setAttribute("aria-hidden", "true");
                ledge.style.top = `${bottom}px`;
                shelf.append(ledge);
            }
        }

        function refresh() {
            cancelAnimationFrame(frame);
            frame = requestAnimationFrame(drawLedges);
        }

        new ResizeObserver(refresh).observe(shelf);
        desktop.addEventListener("change", refresh);
        document.fonts.ready.then(refresh);
        refresh();
    });
})();
</script>
