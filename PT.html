<button

    data-front="images/stamps/stamp1-front.png"
    data-notes="Actually wasn't very nervous, the first public talk felt so massive so I had practiced and rehearsed the outline so many times.

    All things considered, it wasn't terrible. Considering it becomes more of a reenactment instead of discourse. Im sure it didn't come across very conversational or natural, but still one of my favorite outlines!"
    aria-label="Open stamp 56"
>
    <img

        alt="Stamp 56"
    >
</button>

This talk was one of my biggest challenges. I had less time to prepare and familiarize myself with the material than I did for my first outline, and I didn’t feel as prepared going into it. Still, it was a great opportunity to cut my teeth, learn to convey the outline more effectively, and develop my stage presence."

    <!-- =========================================
         STAMP POPUP
         ========================================= -->

    <dialog
    id="stamp-notes-dialog"
    class="stamp-notes-dialog"
    aria-label="Stamp and personal notes"
>
    <button
        class="stamp-notes-close"
        type="button"
        aria-label="Close stamp"
    >×</button>

    <button
        class="stamp-notes-flipper"
        type="button"
        aria-label="Flip stamp"
        aria-describedby="stamp-notes-hint"
    >
        <span class="stamp-notes-inner">

            <span class="stamp-notes-face stamp-notes-front">
                <img id="stamp-notes-image" alt="">
            </span>

            <span class="stamp-notes-face stamp-notes-back">
                <span class="stamp-notes-label"></span>
                <span id="stamp-notes-text"></span>
                <span class="stamp-notes-signature">
                    FROM THE ARCHIVE OF ETHAN WILSON
                </span>
            </span>

        </span>
    </button>

    <p id="stamp-notes-hint" class="stamp-notes-hint">
        CLICK STAMP TO FLIP
    </p>
</dialog>
